<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark">S</span>
    <span>Skill<span>Swap</span></span>
  </div>

  <nav class="nav-list" aria-label="Primary navigation">
    @for (item of navItems; track item.label) {
      <button
        class="nav-item"
        [class.active]="item.label === activeItem"
        (click)="onSelect(item.label)"
      >
        <app-icon [name]="item.icon" [size]="17" />
        <span>{{ item.label }}</span>
        @if (item.badge) {
          <b class="badge">{{ item.badge }}</b>
        }
      </button>
    }
  </nav>

  <div class="sidebar-promo">
    <strong>Share Skills.<br />Learn More.</strong>
    <p>Connect, learn, and grow together.</p>
    <div class="promo-people">
      <div class="person one"></div>
      <div class="high-five">✦</div>
      <div class="person two"></div>
    </div>
    <button class="promo-button" (click)="onSelect('Explore Skills')">
      Explore Skills
    </button>
  </div>

  <button class="nav-item logout" (click)="onSelect('Logout')">
    <app-icon name="logout" [size]="17" />
    <span>Logout</span>
  </button>
</aside>
